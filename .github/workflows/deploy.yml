name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Diagnose test run
        run: |
          tsc && node scripts/copy-assets.mjs
          echo "===== node $(node -v) / tsc $(npx tsc --version)"
          echo "===== dist:"; ls -la dist
          echo "===== dist/test:"; ls -la dist/test
          node --test dist/test

      # Rebuilds the irdb/lirc indexes from upstream on every deploy so the
      # shipped data stays current. Both scripts are make-like and skip work
      # when the upstream commit is unchanged.
      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5